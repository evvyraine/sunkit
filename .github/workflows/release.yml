name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships a recent npm; we still upgrade below to guarantee the
          # npm CLI version required for Trusted Publishing (>= 11.5.1).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use latest npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      # Opens/updates a "Version Packages" PR when changesets are present, or
      # publishes to npm once that PR is merged. Authentication uses npm
      # Trusted Publishing (OIDC) via `id-token: write`, so there is no
      # NPM_TOKEN to store or rotate. Provenance is attached on publish.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: bash scripts/publish.sh
          commit: "chore: version packages"
          title: "chore: version packages"
          # The publish script creates the git tag and GitHub Release itself
          # (it uses `npm publish` for OIDC support, not `changeset publish`).
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
